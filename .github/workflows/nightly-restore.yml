# Nightly proof that the regression kit's restore path never rots (CLAUDE.md 9.5): apply every
# injection, restore the baseline, smoke. Targets the demo environment (atlas-stg is cut), runs at
# 03:00 UTC, and refuses to run within 6 hours of a scheduled episode (docs/episodes.yaml).
name: nightly-restore

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: atlas-mutations
  cancel-in-progress: false

jobs:
  apply-then-restore:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, mid-series
    environment: atlas
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Blackout window (6 h either side of an episode)
        id: blackout
        run: python3 scripts/ci_blackout.py docs/episodes.yaml
      - uses: astral-sh/setup-uv@v6
      - env:
          ATLAS_ENV_FILE: ${{ vars.ATLAS_ENV_FILE }}
        run: |
          uv python install 3.13
          uv sync --python 3.13 --group dev --locked
          echo "$ATLAS_ENV_FILE" >> "$GITHUB_ENV"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply every injection
        run: |
          for n in weak_instructions latency stale_knowledge prompt_injection bad_tool_description; do
            uv run python -m scripts.inject_$n --apply
            uv run python -m scripts.inject_$n --status
          done
      # Runs even when an injection step failed - but never inside the blackout window: a refused
      # run must not write anything, the restore included.
      - name: Restore the baseline and smoke (always runs, outside the blackout)
        if: always() && steps.blackout.outcome == 'success'
        run: uv run python -m scripts.restore_baseline
