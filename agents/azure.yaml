# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# ATLAS AGENTS project (the second azd project; CLAUDE.md 7.3).
#
# Shape generated by `azd ai agent init` (azure.ai.agents 1.0.0-beta.15) against the EXISTING
# project that infra/main.bicep provisioned: `ai-project` points at it by endpoint and declares no
# deployments, so Bicep stays the single owner of the project and its models.
#
#   make hosted-deploy        stage agents/src/atlas-incident-agent, then azd deploy -C agents
#
# The agent code is NOT in this directory. scripts/package_hosted_agent.py stages the one agent
# definition (atlas_agent) plus the hosting adapter (atlas_hosted_agent) into src/ before deploy.

name: atlas-agents

services:
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}

  atlas-incident-agent:
    project: src/atlas-incident-agent
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    kind: hosted
    name: atlas-incident-agent
    description: >-
      ATLAS incident triage for Contoso Cloud Operations. The same atlas_agent definition the
      web app runs in-process, hosted by Foundry under its own Entra agent identity.
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      # Foundry installs requirements.txt (exact pins exported from uv.lock) in the cloud.
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    # FOUNDRY_* and APPLICATIONINSIGHTS_CONNECTION_STRING are injected by the platform; never
    # declared here (CLAUDE.md 7.4). The data endpoints are the same the web app uses: until
    # Phase 09 the tools read Cosmos and Search directly under the agent's own identity.
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      ATLAS_COSMOS_ENDPOINT: ${ATLAS_COSMOS_ENDPOINT}
      ATLAS_COSMOS_DATABASE: ${ATLAS_COSMOS_DATABASE}
      ATLAS_SEARCH_ENDPOINT: ${ATLAS_SEARCH_ENDPOINT}
      ATLAS_FOUNDRY_ACCOUNT_NAME: ${ATLAS_FOUNDRY_ACCOUNT_NAME}
      ATLAS_REASONING_EFFORT: none
    # Content-safety guardrail by full ARM id (a bare name fails open; API-NOTES 10.2). A `$ref`
    # rather than ${ATLAS_RAI_POLICY_ID}: this extension version passes ${...} inside `policies`
    # through verbatim (API-NOTES 12). scripts/package_hosted_agent.py writes the file.
    policies:
      - $ref: ./.generated/rai-policy.yaml

infra:
  provider: microsoft.foundry
