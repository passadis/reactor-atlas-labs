[project]
name = "atlas-hosted-agent"
version = "0.1.0"
description = "ATLAS Foundry hosted agent entrypoint (Responses protocol, port 8088)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "atlas-common",
    "atlas-agent",
    "agent-framework-foundry-hosting==1.0.0b260821",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_hosted_agent"]

[tool.uv.sources]
atlas-common = { workspace = true }
atlas-agent = { workspace = true }
