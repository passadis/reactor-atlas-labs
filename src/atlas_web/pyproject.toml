[project]
name = "atlas-web"
version = "0.1.0"
description = "ATLAS FastAPI web application: streaming chat console and approval UI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "atlas-common",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sse-starlette==3.4.11",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_web"]

[tool.uv.sources]
atlas-common = { workspace = true }
