[project]
name = "atlas-agent"
version = "0.1.0"
description = "ATLAS core incident agent: instructions, typed tools, structured outputs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "atlas-common",
    "agent-framework==1.18.0",
    "agent-framework-foundry==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_agent"]

[tool.uv.sources]
atlas-common = { workspace = true }
