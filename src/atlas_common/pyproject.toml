[project]
name = "atlas-common"
version = "0.1.0"
description = "ATLAS shared library: auth, config, models, telemetry, repositories"
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-identity==1.25.3",
    "azure-cosmos==4.17.0",
    "azure-search-documents==12.0.0",
    "azure-storage-blob==12.30.1",
    "azure-monitor-opentelemetry==1.8.10",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-api==1.44.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    # Imported directly (embeddings, async Azure clients); pinned rather than left transitive.
    "openai==3.14.0",
    "aiohttp==3.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_common"]

