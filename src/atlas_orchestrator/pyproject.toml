[project]
name = "atlas-orchestrator"
version = "0.1.0"
description = "ATLAS multi-agent workflow: executors, policy gate, checkpoints, HITL"
requires-python = ">=3.13,<3.14"
dependencies = [
    "atlas-common",
    "atlas-agent",
    "agent-framework==1.18.0",
    "agent-framework-foundry==1.13.0",
    "agent-framework-orchestrations==1.1.1",
    "agent-framework-azure-cosmos==1.0.0b260910",
    "azure-servicebus==7.14.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sse-starlette==3.4.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_orchestrator"]

[tool.uv.sources]
atlas-common = { workspace = true }
atlas-agent = { workspace = true }
