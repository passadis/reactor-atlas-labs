[project]
name = "atlas-worker"
version = "0.1.0"
description = "ATLAS Service Bus consumer: remediation executor"
requires-python = ">=3.13,<3.14"
dependencies = [
    "atlas-common",
    "azure-servicebus==7.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_worker"]

[tool.uv.sources]
atlas-common = { workspace = true }
